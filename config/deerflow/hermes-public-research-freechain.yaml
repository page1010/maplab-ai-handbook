# Hermes -> DeerFlow free-chain profile (Ollama successor, 2026-09-21).
# The credential is process-only.  Code refuses this profile until both the
# authenticated account-policy gate and explicit paid-route approval are true.
config_version: 36
log_level: warning

logging:
  enhance:
    enabled: false
    format: text

token_usage:
  enabled: true

token_budget:
  enabled: true
  max_tokens: 30000
  max_input_tokens: 26000
  max_output_tokens: 4000
  warn_threshold: 0.7
  hard_stop_threshold: 1.0

max_recursion_limit: 24

# One-shot Hermes research must never reuse DeerFlow's checkout-level SQLite
# checkpoint.  Durable orchestration lives in MAPLAB's own job receipts.
database:
  backend: memory

run_events:
  backend: memory

models:
  # 2026-09-21 Owner「hermes 就是 ollama 的接班」：DeerFlow 的引擎改用 Hermes
  # 同一條 OpenRouter 免費鏈（8/30 拔除本機 Ollama 後 local 引擎已不存在）。
  # 免費模型不保證 ZDR，只用於公開資料研究；證據包本身即公開來源，不含私有資料。
  - name: hermes-freechain
    display_name: Hermes OpenRouter free chain
    use: langchain_openai:ChatOpenAI
    model: minimax/minimax-m3:free
    api_key: $OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    request_timeout: 120.0
    max_retries: 2
    max_tokens: 3000
    context_window: 131072
    temperature: 0.1
    supports_thinking: false
    supports_vision: false
    extra_body:
      # OpenRouter 原生 fallback：主模型壅塞(429)時依序改用，與 Hermes 設定同序
      models:
        - minimax/minimax-m3:free
        - z-ai/glm-5.2:free
        - nvidia/nemotron-3-super-120b-a12b:free

# Retrieval is performed once by the deterministic supervisor.  The model sees
# a bounded public evidence pack and receives no callable tools.
tool_groups: []
tools: []

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false

memory:
  enabled: false
  injection_enabled: false
  manager_class: noop

title:
  enabled: false

summarization:
  enabled: false

skills:
  path: /Users/pagemacmini/maplab-ai-handbook/config/deerflow/no-skills
  deferred_discovery: false

subagent_runtime:
  max_running: 1
  max_queued: 1
  admission_policy: reject
  queue_timeout_seconds: 1

subagents:
  timeout_seconds: 300
  max_turns: 12
  max_total_per_run: 1
  token_budget:
    enabled: true
    max_tokens: 12000
    warn_threshold: 0.7
    hard_stop_threshold: 1.0

scheduler:
  enabled: false

mcp_tasks:
  enabled: false

guardrails:
  # The bridge gives this policy middleware a distinct runtime name from the
  # RBAC adapter, preserving both fail-closed gates despite an upstream naming
  # collision in the pinned DeerFlow/LangChain combination.
  enabled: true
  fail_closed: true
  provider:
    use: deerflow.guardrails.builtin:AllowlistProvider
    config:
      allowed_tools: []

authorization:
  enabled: true
  fail_closed: true
  default_role: guest
  provider:
    use: deerflow.authz.rbac:RbacAuthorizationProvider
    config:
      roles:
        guest:
          tools: {allow: []}
          models:
            allow:
              - hermes-freechain
          routes:
            allow: false
          sandbox:
            allow: false
