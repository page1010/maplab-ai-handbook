<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>MAPLAB Agent Commander</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:430px; background:#0d0f14; color:#e8ecf4; font-family:'JetBrains Mono','Fira Code',monospace; font-size:13px; }
.header { background:#111520; border-bottom:1px solid #1e2535; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
.logo { font-size:13px; font-weight:700; color:#e8a838; }
.header-right { display:flex; align-items:center; gap:8px; }
.overdue-badge { font-size:10px; color:#e85538; }
.version { font-size:10px; color:#5a6a80; }
.body { padding:14px; display:flex; flex-direction:column; gap:12px; }
.status-bar { background:#141820; border:1px solid #1e2535; border-radius:5px; padding:8px 12px; display:flex; align-items:center; gap:8px; }
.status-dot { width:7px; height:7px; border-radius:50%; background:#5a6a80; flex-shrink:0; }
.status-dot.ok { background:#38e87a; }
.status-dot.loading { background:#e8a838; animation:pulse 1s infinite; }
.status-dot.err { background:#e85538; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.status-text { font-size:11px; color:#9baab8; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.section-label { font-size:10px; color:#5a6a80; text-transform:uppercase; margin-bottom:5px; letter-spacing:0.05em; }
.role-selector { display:flex; align-items:center; gap:10px; }
.role-selector label { font-size:10px; color:#7a8a9d; text-transform:uppercase; flex-shrink:0; }
.role-select { flex:1; padding:8px 10px; background:#141820; border:1px solid #1e2535; border-radius:5px; color:#e8a838; font-family:inherit; font-size:12px; font-weight:700; outline:none; cursor:pointer; }
.role-select:focus { border-color:#e8a838; }
.role-select option { background:#141820; color:#e8ecf4; }
.role-status { font-size:10px; color:#9baab8; padding:4px 0; line-height:1.6; }
.role-status .critical { color:#e85538; font-weight:bold; }
.role-status .active { color:#38e87a; }
.role-status .pending { color:#e8a838; }
.role-status .new { color:#6a9ae8; }
.module-card { background:#10141d; border:1px solid #1e2535; border-radius:6px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
.module-title { font-size:11px; color:#e8a838; font-weight:700; line-height:1.5; }
.module-meta { font-size:10px; color:#9baab8; line-height:1.65; }
.module-meta strong { color:#d0d8e8; font-weight:700; }
.module-chips { display:flex; flex-wrap:wrap; gap:5px; }
.module-chip { font-size:10px; color:#9baab8; border:1px solid #263145; border-radius:999px; padding:3px 7px; background:#0a0d12; }
.module-chip.warn { color:#e8a838; border-color:#5a4218; }
.module-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.module-list { max-height:76px; overflow:auto; padding:6px 8px; background:#0a0d12; border:1px solid #1a2030; border-radius:5px; color:#9baab8; font-size:10px; line-height:1.55; }
.module-freshness { padding:7px 8px; background:#0a0d12; border:1px solid #1a2030; border-radius:5px; color:#7a8a9d; font-size:10px; line-height:1.55; }
.module-freshness.ok { color:#38e87a; border-color:#1d5a38; }
.module-freshness.warn { color:#e8a838; border-color:#5a4218; }
.module-freshness.err { color:#e85538; border-color:#5a2118; }
.runtime-selector { display:flex; align-items:center; gap:10px; }
.runtime-selector label { font-size:10px; color:#7a8a9d; text-transform:uppercase; flex-shrink:0; }
.runtime-select { flex:1; padding:8px 10px; background:#141820; border:1px solid #1e2535; border-radius:5px; color:#9fd1ff; font-family:inherit; font-size:12px; font-weight:700; outline:none; cursor:pointer; }
.runtime-select:focus { border-color:#6a9ae8; }
.runtime-select option { background:#141820; color:#e8ecf4; }
.prompt-box { background:#0a0d12; border:1px solid #1e2535; border-radius:5px; overflow:hidden; }
.prompt-box-header { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:#111520; border-bottom:1px solid #1a2030; }
.prompt-box-label { font-size:10px; color:#7a8a9d; }
.token-count { font-size:10px; color:#5a6a80; }
.token-count.warn { color:#e8a838; }
#promptText { width:100%; min-height:220px; max-height:300px; padding:12px; background:transparent; border:none; color:#d0d8e8; font-family:inherit; font-size:12px; line-height:1.8; resize:none; outline:none; overflow-y:auto; }
.btn-copy { width:100%; padding:11px; background:#e8a838; border:none; border-radius:5px; color:#0d0f14; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; }
.btn-copy.copied { background:#38e87a; color:#0a1a10; }
.btn-handoff { width:100%; padding:11px; background:#163022; border:1px solid #2d7a54; border-radius:5px; color:#8ee8b8; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; }
.btn-handoff:hover { background:#1b3d2b; color:#bcffd7; }
.btn-inject { width:100%; padding:11px; background:#1e3555; border:1px solid #3a6aaa; border-radius:5px; color:#6a9ae8; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; }
.btn-inject:hover { background:#2a4a7a; color:#a0c8ff; }
.btn-refresh { width:100%; padding:8px; background:transparent; border:1px solid #1e2535; border-radius:4px; color:#7a8a9d; font-family:inherit; font-size:11px; cursor:pointer; }
.btn-refresh:hover { border-color:#e8a838; color:#e8a838; }
.btn-sync { flex:1; padding:8px; background:transparent; border:1px solid #263145; border-radius:4px; color:#9fd1ff; font-family:inherit; font-size:11px; cursor:pointer; }
.btn-sync:hover { border-color:#6a9ae8; color:#c8e6ff; }
.btn-reload { flex:1; padding:8px; background:transparent; border:1px solid #2a3a1a; border-radius:4px; color:#5a8a4a; font-family:inherit; font-size:11px; cursor:pointer; }
.btn-reload:hover { border-color:#38e87a; color:#38e87a; }
.btn-bot-fetch { width:100%; padding:11px; background:#1a2a1a; border:1px solid #2a4a2a; border-radius:5px; color:#5a9a5a; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; }
.btn-bot-fetch:hover { background:#1e3a1e; border-color:#38e87a; color:#38e87a; }
.btn-row { display:flex; gap:8px; }
hr { border:none; border-top:1px solid #1a2030; }
.field label { display:block; font-size:10px; color:#7a8a9d; text-transform:uppercase; margin-bottom:5px; }
.field input { width:100%; padding:8px 10px; background:#141820; border:1px solid #1e2535; border-radius:5px; color:#e8ecf4; font-family:inherit; font-size:11px; outline:none; }
.field input:focus { border-color:#e8a838; }
.save-status { font-size:11px; text-align:center; color:#38e87a; min-height:16px; opacity:0; transition:opacity .3s; }
.save-status.show { opacity:1; }
.links { display:flex; gap:12px; }
.links a { font-size:11px; color:#6a9ae8; text-decoration:none; }
.links a:hover { color:#e8a838; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">⬡ MAPLAB COMMANDER</div>
  <div class="header-right">
    <span class="overdue-badge" id="overdueCount"></span>
    <span class="version" id="versionBadge">v5.5.2</span>
  </div>
</div>
<div class="body">
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">讀取中...</div>
  </div>
  <div>
    <div class="role-selector">
      <label>召喚角色</label>
      <select class="role-select" id="roleSelect">
        <option value="">-- 總覽模式 --</option>
        <option value="A0">A0｜Cowork 總調度秘書</option>
        <option value="A1">A1｜系統總管中心</option>
        <option value="A2">A2｜搜尋流量作戰部</option>
        <option value="A3">A3｜社群與廣告成長部</option>
        <option value="A4">A4｜影像資產整理部</option>
        <option value="A5">A5｜報價與提案引擎部</option>
        <option value="A6">A6｜業務快反應部隊</option>
        <option value="A7">A7｜客服與對話轉單部</option>
        <option value="A8">A8｜影音內容產線</option>
        <option disabled>── Investment OS / Cross-Project ──</option>
        <option value="B1">B1｜投資邏輯橋接顧問</option>
      </select>
    </div>
    <div class="role-status" id="roleStatus"></div>
  </div>
  <div class="runtime-selector">
    <label>交接目標</label>
    <select class="runtime-select" id="runtimeSelect">
      <option value="gemini">Gemini 側邊欄</option>
      <option value="codex">Codex / A1</option>
      <option value="openclaw">OpenClaw / A6</option>
      <option value="claude_tab">Claude tab（legacy）</option>
    </select>
  </div>
  <div class="module-card" id="moduleCard">
    <div class="module-title" id="moduleTitle">任務模組尚未載入</div>
    <div class="module-meta" id="moduleMeta">選擇角色後顯示必讀來源、技能組、影響範圍與輸出契約。</div>
    <div class="module-chips" id="moduleChips"></div>
    <div class="module-grid">
      <div>
        <div class="section-label">Read First</div>
        <div class="module-list" id="moduleSources">—</div>
      </div>
      <div>
        <div class="section-label">Affects</div>
        <div class="module-list" id="moduleAffects">—</div>
      </div>
    </div>
    <div class="module-freshness" id="moduleFreshness">Markdown 同步尚未檢查</div>
  </div>
  <div>
    <div class="section-label" id="promptLabel">⚡ Runtime Handoff Prompt</div>
    <div class="prompt-box">
      <div class="prompt-box-header">
        <span class="prompt-box-label" id="promptBoxLabel">總覽模式</span>
        <span class="token-count" id="tokenCount">— chars</span>
      </div>
      <textarea id="promptText" readonly placeholder="選擇角色後顯示專屬召喚 prompt..."></textarea>
    </div>
  </div>
  <button class="btn-handoff" id="handoffBtn">📦 複製任務模組 Handoff</button>
  <button class="btn-copy" id="copyBtn">📋 複製目前文字</button>
  <button class="btn-inject" id="injectBtn">⚡ Legacy: 注入 Claude tab</button>
  <hr>
  <div class="field">
    <label>GitHub Raw Base URL</label>
    <input type="text" id="githubRawBase" placeholder="https://raw.githubusercontent.com/page1010/maplab-ai-handbook/main" />
  </div>
  <div class="field">
    <label>GitHub Token（存本地，不上傳）</label>
    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" />
  </div>
  <div class="btn-row">
    <button class="btn-refresh" id="refreshBtn" style="flex:1">↻ 重新抓取</button>
    <button class="btn-sync" id="syncBtn">檢查 MD 同步</button>
    <button class="btn-reload" id="reloadBtn">⟳ 重載 Extension</button>
  </div>
  <div class="save-status" id="saveStatus"></div>
  <div class="links">
    <a href="https://github.com/page1010/maplab-ai-handbook" target="_blank">📂 Repo</a>
    <a href="https://github.com/page1010/maplab-ai-handbook/blob/main/CURRENT_STATUS.md" target="_blank">📋 STATUS</a>
    <a href="https://github.com/page1010/maplab-ai-handbook/blob/main/AGENT_RECALL_PROMPTS.md" target="_blank">📝 PROMPTS</a>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
