    {
      "id": "ollama_local",
      "display_name": "Ollama local runtime",
      "kind": "local_runtime",
      "usage_source_priority": ["authenticated_cli_health", "unknown"],
      "health_probe": ["ollama", "list"],
      "probe_enabled": true,
      "policy": "allowed_for_eval_and_narrow_domain_routines"
    }
