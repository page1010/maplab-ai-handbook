<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Google Sans', 'Noto Sans TC', Arial, sans-serif;
      font-size: 14px;
      padding: 20px;
      color: #202124;
    }
    h3 { margin: 0 0 16px; font-size: 16px; color: #1a73e8; }
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .required::after { content: ' *'; color: #d93025; }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: #1a73e8; }
    .hint {
      font-size: 12px;
      color: #5f6368;
      margin-top: 2px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }
    .checkbox-row input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    .checkbox-row label {
      margin: 0;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-row {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    button {
      padding: 8px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    #cancelBtn {
      background: #f1f3f4;
      color: #202124;
    }
    #cancelBtn:hover { background: #e8eaed; }
    #submitBtn {
      background: #1a73e8;
      color: #fff;
    }
    #submitBtn:hover { background: #1765cc; }
    #submitBtn:disabled { background: #8ab4f8; cursor: not-allowed; }
    .msg-error  { color: #d93025; font-size: 13px; margin-top: 10px; }
    .msg-success {
      color: #137333;
      font-size: 13px;
      margin-top: 10px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <h3>產出報價單</h3>

  <label class="required">客戶名稱</label>
  <input type="text" id="customer" placeholder="例：王小明">

  <label class="required">活動日期</label>
  <input type="date" id="date">

  <label>活動時間</label>
  <input type="time" id="time" placeholder="例：14:00">

  <label>完整地址</label>
  <input type="text" id="address" placeholder="（選填）">

  <label class="required">活動類型</label>
  <select id="eventType">
    <option value="">-- 請選擇 --</option>
    <option value="生日派對">生日派對</option>
    <option value="企業聚會">企業聚會</option>
    <option value="婚禮">婚禮</option>
    <option value="外燴到府">外燴到府</option>
    <option value="尾牙/春酒">尾牙/春酒</option>
    <option value="節日聚餐">節日聚餐</option>
    <option value="其他">其他</option>
  </select>

  <label>預計人數</label>
  <input type="number" id="headcount" placeholder="例：30" min="1">

  <label>活動名稱</label>
  <input type="text" id="eventName" placeholder="（選填）">

  <label>總品項數</label>
  <input type="number" id="totalItems" placeholder="（選填）" min="1">

  <label>訂金金額（個人預設 $3,000，可依案件規模調整）</label>
  <input type="number" id="depositAmount" placeholder="3000" min="0" value="3000">

  <label>飲食禁忌 / 客戶偏好（例：不要牛羊、不要起司、中西合併）</label>
  <textarea id="dietaryNotes" rows="2" placeholder="（選填，業務接洽時抄下客戶明確說的禁忌與偏好）" style="width:100%;font-family:inherit;"></textarea>

  <label>樓層/搬運狀況（2F 以上無電梯會加收搬運費）</label>
  <select id="floorFeeMode">
    <option value="none">平面 / 有電梯（$0）</option>
    <option value="with_help">2F 無電梯，客戶有人協助搬運（$500）</option>
    <option value="no_help">2F 無電梯，MAPLAB 獨力搬運（$1,000）</option>
  </select>

  <div class="checkbox-row">
    <input type="checkbox" id="noDeposit">
    <label for="noDeposit">⚠️ 不收訂金（例外：活動後一次付清 → to_b_full）</label>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="isMarketingAgency">
    <label for="isMarketingAgency">行銷／公關公司（高變動專案型 → to_b_marketing）</label>
  </div>

  <div id="message"></div>

  <div class="btn-row">
    <button id="cancelBtn" onclick="google.script.host.close()">取消</button>
    <button id="submitBtn" onclick="submitForm()">產出報價單</button>
  </div>

  <script>
    // 頁面載入後從 QUOTE_DRAFT 預填
    window.onload = function() {
      google.script.run
        .withSuccessHandler(prefillForm)
        .withFailureHandler(function() { /* 預填失敗靜默忽略 */ })
        .getQuoteDraftValues();
    };

    function prefillForm(data) {
      if (!data) return;
      if (data.clientName) document.getElementById('customer').value   = data.clientName;
      if (data.eventDate)  document.getElementById('date').value       = data.eventDate;
      if (data.address)    document.getElementById('address').value    = data.address;
      if (data.eventType)  document.getElementById('eventType').value  = data.eventType;
      if (data.headcount)  document.getElementById('headcount').value  = data.headcount;
      if (data.eventName)  document.getElementById('eventName').value  = data.eventName;
      if (data.totalItems) document.getElementById('totalItems').value = data.totalItems;
    }

    function submitForm() {
      var customer  = document.getElementById('customer').value.trim();
      var date      = document.getElementById('date').value;
      var eventType = document.getElementById('eventType').value;
      var msgEl     = document.getElementById('message');

      if (!customer || !date || !eventType) {
        msgEl.innerHTML = '<p class="msg-error">請填寫必填欄位：客戶名稱、活動日期、活動類型。</p>';
        return;
      }

      var formData = {
        customer   : customer,
        date       : date,
        time       : document.getElementById('time').value.trim(),
        address    : document.getElementById('address').value.trim(),
        eventType  : eventType,
        headcount  : document.getElementById('headcount').value.trim(),
        eventName         : document.getElementById('eventName').value.trim(),
        totalItems        : document.getElementById('totalItems').value.trim(),
        depositAmount     : document.getElementById('depositAmount').value || '3000',
        dietaryNotes      : document.getElementById('dietaryNotes').value.trim(),
        floorFeeMode      : document.getElementById('floorFeeMode').value || 'none',
        noDeposit         : document.getElementById('noDeposit').checked,
        isMarketingAgency : document.getElementById('isMarketingAgency').checked
      };

      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '處理中…';
      msgEl.innerHTML = '';

      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .createQuote(formData);
    }

    function onSuccess(result) {
      var btn = document.getElementById('submitBtn');
      btn.textContent = '完成';
      document.getElementById('message').innerHTML =
        '<p class="msg-success">' +
        '✓ 報價單已建立！<br>' +
        '案件編號：<strong>' + result.caseId + '</strong><br>' +
        '檔案名稱：' + result.fileName + '<br>' +
        '<a href="' + result.url + '" target="_blank">開啟報價單 ↗</a>' +
        '</p>';
    }

    function onFailure(error) {
      var btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.textContent = '產出報價單';
      document.getElementById('message').innerHTML =
        '<p class="msg-error">錯誤：' + error.message + '</p>';
    }
  </script>
</body>
</html>
