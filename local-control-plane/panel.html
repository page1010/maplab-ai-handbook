<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAPLAB Local Control Plane</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 20px; color: #111; }
    h1 { margin: 0 0 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel { border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    .item { border-top: 1px solid #eee; padding: 8px 0; }
    .item:first-child { border-top: 0; }
    .tag { display: inline-block; background: #f1f5f9; border-radius: 6px; padding: 2px 8px; margin: 2px; font-size: 12px; }
    .muted { color: #555; font-size: 13px; }
    code { background: #f8fafc; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>MAPLAB Local Control Plane</h1>
  <p class="muted">Model-agnostic runtime view for roles, capabilities, and task pipeline contracts.</p>

  <div class="row">
    <section class="panel">
      <h2>Roles</h2>
      <div id="roles"></div>
    </section>
    <section class="panel">
      <h2>Pipelines</h2>
      <div id="pipelines"></div>
    </section>
  </div>

  <script src="./panel.js"></script>
</body>
</html>
