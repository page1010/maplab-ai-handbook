<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="'Noto Sans TC','PingFang TC',sans-serif">
  <!-- MAPLAB 報價 Slide 第6頁 加購項示意圖 v1.0 (2026-09-10, Owner 5095)
       改文字即可複用；不得加入價格。配色依 skills/maplab-visual-spec.md -->
  <rect width="900" height="720" fill="#FAF7F2"/>
  <text x="450" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#3A3A2E">活動當天，我們可以一起準備的事</text>
  <text x="450" y="82" text-anchor="middle" font-size="15" fill="#7A5C3E">以下為加購項目，依您的需求選配（費用見前頁摘要）</text>

  <circle cx="450" cy="370" r="88" fill="#8FA68E"/>
  <text x="450" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#FAF7F2">活動當天</text>
  <text x="450" y="390" text-anchor="middle" font-size="14" fill="#FAF7F2">外燴餐檯已含在報價</text>

  <g stroke="#8FA68E" stroke-width="2" opacity="0.55">
    <line x1="450" y1="282" x2="450" y2="238"/><line x1="450" y1="458" x2="450" y2="502"/>
    <line x1="362" y1="370" x2="300" y2="370"/><line x1="538" y1="370" x2="600" y2="370"/>
    <line x1="388" y1="300" x2="330" y2="252"/><line x1="512" y1="440" x2="570" y2="488"/>
  </g>

  <g font-size="17" font-weight="700" fill="#3A3A2E">
    <g><rect x="60" y="120" width="290" height="106" rx="14" fill="#EDE5D8"/>
      <text x="82" y="156">📷 攝影紀錄</text>
      <text x="82" y="184" font-size="14" font-weight="400" fill="#7A5C3E">2–3 小時平面紀錄，活動後</text>
      <text x="82" y="206" font-size="14" font-weight="400" fill="#7A5C3E">交付精修檔，可用於後續宣傳</text></g>
    <g><rect x="550" y="120" width="290" height="106" rx="14" fill="#EDE5D8"/>
      <text x="572" y="156">💐 花藝佈置</text>
      <text x="572" y="184" font-size="14" font-weight="400" fill="#7A5C3E">餐檯與主視覺區鮮花設計</text>
      <text x="572" y="206" font-size="14" font-weight="400" fill="#7A5C3E">（基本乾燥花藝已含在報價）</text></g>
    <g><rect x="30" y="316" width="270" height="106" rx="14" fill="#EDE5D8"/>
      <text x="52" y="352">🔊 音響設備</text>
      <text x="52" y="380" font-size="14" font-weight="400" fill="#7A5C3E">小型 PA 租借，致詞與主持</text>
      <text x="52" y="402" font-size="14" font-weight="400" fill="#7A5C3E">現場收音清晰不斷訊</text></g>
    <g><rect x="600" y="316" width="270" height="106" rx="14" fill="#EDE5D8"/>
      <text x="622" y="352">🚩 訂製食物插旗</text>
      <text x="622" y="380" font-size="14" font-weight="400" fill="#7A5C3E">印上您的 Logo 與品牌色</text>
      <text x="622" y="402" font-size="14" font-weight="400" fill="#7A5C3E">餐點一入鏡就是品牌畫面</text></g>
    <g><rect x="60" y="512" width="290" height="106" rx="14" fill="#EDE5D8"/>
      <text x="82" y="548">🎬 手拿道具</text>
      <text x="82" y="576" font-size="14" font-weight="400" fill="#7A5C3E">合照用標語牌，客製文案</text>
      <text x="82" y="598" font-size="14" font-weight="400" fill="#7A5C3E">讓來賓自然拍照打卡</text></g>
    <g><rect x="550" y="512" width="290" height="106" rx="14" fill="#EDE5D8"/>
      <text x="572" y="548">✂️ 剪綵組合</text>
      <text x="572" y="576" font-size="14" font-weight="400" fill="#7A5C3E">金剪刀與緞帶，可訂製 Logo</text>
      <text x="572" y="598" font-size="14" font-weight="400" fill="#7A5C3E">儀式感一次到位</text></g>
  </g>

  <text x="450" y="676" text-anchor="middle" font-size="13" fill="#7A5C3E">＊加購項由本店代為協調外部廠商，實際費用依廠商報價，確認後併入本報價單。</text>
  <text x="450" y="700" text-anchor="middle" font-size="12" fill="#8FA68E">MAP LAB KITCHEN｜旅圖</text>
</svg>
