<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>MAPLAB Agent Commander</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:380px; background:#0d0f14; color:#c8d0e0; font-family:'JetBrains Mono','Fira Code',monospace; font-size:12px; }
.header { background:#111520; border-bottom:1px solid #1e2535; padding:11px 14px; display:flex; align-items:center; justify-content:space-between; }
.logo { font-size:12px; font-weight:700; color:#e8a838; }
.header-right { display:flex; align-items:center; gap:8px; }
.overdue-badge { font-size:9px; color:#e85538; }
.version { font-size:9px; color:#3a4558; }
.body { padding:12px; display:flex; flex-direction:column; gap:10px; }
.status-bar { background:#141820; border:1px solid #1e2535; border-radius:5px; padding:7px 10px; display:flex; align-items:center; gap:7px; }
.status-dot { width:6px; height:6px; border-radius:50%; background:#3a4558; flex-shrink:0; }
.status-dot.ok { background:#38e87a; }
.status-dot.loading { background:#e8a838; animation:pulse 1s infinite; }
.status-dot.err { background:#e85538; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.status-text { font-size:10px; color:#6b7a96; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.section-label { font-size:9px; color:#3a4558; text-transform:uppercase; margin-bottom:4px; }
.commit-panel { background:#0a0d12; border:1px solid #1a2030; border-radius:5px; overflow:hidden; }
.commit-panel-header { padding:6px 10px; background:#111520; border-bottom:1px solid #1a2030; font-size:9px; color:#4a5568; }
#commitList { max-height:110px; overflow-y:auto; }
.commit-row { display:flex; align-items:center; gap:6px; padding:5px 10px; border-bottom:1px solid #0f1318; font-size:9px; }
.commit-row.is-checkpoint { background:#0d1a0e; border-left:2px solid #38e87a; }
.commit-sha { color:#4a8ae8; flex-shrink:0; width:42px; }
.commit-time { color:#3a4558; flex-shrink:0; width:52px; }
.commit-msg { color:#7a8a9d; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cp-badge { font-size:8px; color:#38e87a; border:1px solid #38e87a44; border-radius:3px; padding:1px 4px; }
.commit-placeholder { padding:10px; color:#2a3348; font-size:9px; }
.prompt-box { background:#0a0d12; border:1px solid #1e2535; border-radius:5px; overflow:hidden; }
.prompt-box-header { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; background:#111520; border-bottom:1px solid #1a2030; }
.prompt-box-label { font-size:9px; color:#4a5568; }
.token-count { font-size:9px; color:#3a4558; }
.token-count.warn { color:#e8a838; }
#promptText { width:100%; min-height:130px; max-height:170px; padding:9px 10px; background:transparent; border:none; color:#9ba8bd; font-family:inherit; font-size:10px; line-height:1.75; resize:none; outline:none; overflow-y:auto; }
.btn-copy { width:100%; padding:9px; background:#e8a838; border:none; border-radius:5px; color:#0d0f14; font-family:inherit; font-size:11px; font-weight:700; cursor:pointer; }
.btn-copy.copied { background:#38e87a; color:#0a1a10; }
.btn-refresh { width:100%; padding:7px; background:transparent; border:1px solid #1e2535; border-radius:4px; color:#4a5568; font-family:inherit; font-size:10px; cursor:pointer; }
.btn-refresh:hover { border-color:#e8a838; color:#e8a838; }
hr { border:none; border-top:1px solid #141820; }
.field label { display:block; font-size:9px; color:#4a5568; text-transform:uppercase; margin-bottom:4px; }
.field input { width:100%; padding:6px 9px; background:#141820; border:1px solid #1e2535; border-radius:4px; color:#c8d0e0; font-family:inherit; font-size:10px; outline:none; }
.field input:focus { border-color:#e8a838; }
.save-status { font-size:10px; text-align:center; color:#38e87a; min-height:14px; opacity:0; transition:opacity .3s; }
.save-status.show { opacity:1; }
.links { display:flex; gap:10px; }
.links a { font-size:10px; color:#4a8ae8; text-decoration:none; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">⬡ MAPLAB COMMANDER</div>
  <div class="header-right">
    <span class="overdue-badge" id="overdueCount"></span>
    <span class="version">v4.2</span>
  </div>
</div>
<div class="body">
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">讀取中...</div>
  </div>
  <div>
    <div class="section-label">最近 commit（CP = checkpoint）</div>
    <div class="commit-panel">
      <div class="commit-panel-header">GitHub commit history</div>
      <div id="commitList"><div class="commit-placeholder">載入中...</div></div>
    </div>
  </div>
  <div>
    <div class="section-label">⚡ Startup Prompt</div>
    <div class="prompt-box">
      <div class="prompt-box-header">
        <span class="prompt-box-label">壓縮狀態注入</span>
        <span class="token-count" id="tokenCount">— chars</span>
      </div>
      <textarea id="promptText" readonly placeholder="自動從 CURRENT_STATUS + commit history 合成..."></textarea>
    </div>
  </div>
  <button class="btn-copy" id="copyBtn" onclick="copyPrompt()">📋 複製 Startup Prompt</button>
  <hr>
  <div class="field">
    <label>GitHub Raw Base URL</label>
    <input type="text" id="githubRawBase" placeholder="https://raw.githubusercontent.com/page1010/maplab-ai-handbook/main" />
  </div>
  <div class="field">
    <label>GitHub Token（存本地，不上傳）</label>
    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" />
  </div>
  <button class="btn-refresh" onclick="saveAndReload()">↻ 重新抓取</button>
  <div class="save-status" id="saveStatus"></div>
  <div class="links">
    <a href="https://github.com/page1010/maplab-ai-handbook" target="_blank">📂 Repo</a>
    <a href="https://github.com/page1010/maplab-ai-handbook/blob/main/CURRENT_STATUS.md" target="_blank">📋 CURRENT_STATUS</a>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
