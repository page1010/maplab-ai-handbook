      "probe_enabled": false,
      "policy": "blocked_without_owner_case_specific_approval_and_budget"
    },
    {
      "id": "claude_subscription",
      "display_name": "Claude subscription",
      "kind": "subscription_cli",
      "usage_source_priority": ["local_request_ledger", "authenticated_cli_health", "manual_override", "unknown"],
      "health_probe": ["claude", "auth", "status"],
      "probe_enabled": true,
      "policy": "allowed_for_bounded_teacher_job_after_verified_or_estimated_quota"
    },
    {
      "id": "gemini_api",
      "display_name": "Gemini API / Google Cloud",
      "kind": "metered_api",
      "usage_source_priority": ["official_cloud_quota", "official_console_export", "local_request_ledger", "manual_override", "unknown"],
      "probe_enabled": false,
      "policy": "blocked_without_owner_case_specific_approval_and_budget"
    },
    {
      "id": "antigravity_subscription",
